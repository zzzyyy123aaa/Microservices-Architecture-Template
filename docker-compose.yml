version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    ports: ["5432:5432"]
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_MULTIPLE_DATABASES: "user_db,order_db,product_db" }
    volumes: [postgres_data:/var/lib/postgresql/data, ./docker/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 10s, timeout: 5s, retries: 5 }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]

  consul:
    image: consul:1.15
    ports: ["8500:8500"]
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0

  prometheus:
    image: prom/prometheus:v2.48.0
    ports: ["9090:9090"]
    volumes: [./infrastructure/monitor/prometheus.yml:/etc/prometheus/prometheus.yml]

  grafana:
    image: grafana/grafana:10.2.2
    ports: ["3001:3000"]
    environment: { GF_SECURITY_ADMIN_USER: admin, GF_SECURITY_ADMIN_PASSWORD: admin }
    volumes: [./infrastructure/monitor/grafana/provisioning:/etc/grafana/provisioning]
    depends_on: [prometheus]

  gateway:
    build: { context: ., dockerfile: gateway/Dockerfile }
    ports: ["8000:8000"]
    environment: { NODE_ENV: production, JWT_SECRET: your-secret-key }
    depends_on: [consul]

  user-service:
    build: { context: ., dockerfile: services/user-service/Dockerfile }
    ports: ["8001:8001"]
    environment: { NODE_ENV: production, DB_HOST: postgres, DB_NAME: user_db, JWT_SECRET: your-secret-key }
    depends_on: [postgres]

  order-service:
    build: { context: ., dockerfile: services/order-service/Dockerfile }
    ports: ["8002:8002"]
    environment: { NODE_ENV: production, DB_HOST: postgres, DB_NAME: order_db }
    depends_on: [postgres]

  product-service:
    build: { context: ., dockerfile: services/product-service/Dockerfile }
    ports: ["8003:8003"]
    environment: { NODE_ENV: production, DB_HOST: postgres, DB_NAME: product_db }
    depends_on: [postgres]

  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    ports: ["3000:80"]
    depends_on: [gateway]

volumes:
  postgres_data:
  redis_data:
